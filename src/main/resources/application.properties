# --- Server ---
server.port=8080

# --- MySQL DataSource ---
# Values come from environment variables so the same image works locally and in ECS/Fargate.
# Locally, these defaults point at a local MySQL instance.
# In ECS, set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD via the task definition (password via Secrets Manager).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskmanagementsystem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
